[pytest]
# Repo-root pytest configuration. There was none before, so behaviour depended
# on how pytest happened to be invoked:
#
#   * `backend/__init__.py` does not exist, and neither does
#     `backend/tests/__init__.py`. Test modules import `backend.services...`
#     281 times, which only resolves if the repository root is on sys.path.
#     Under pytest's default `prepend` import mode the inserted directory is
#     `backend/tests`, not the root — so `python -m pytest` worked (it adds the
#     CWD) while a bare `pytest` did not. `pythonpath = .` makes both work.
#
#   * 68 tests are `@pytest.mark.asyncio`. `asyncio_mode = auto` runs async
#     tests whether or not they carry the marker, so an unmarked coroutine test
#     is executed instead of erroring with "async def functions are not
#     natively supported".
testpaths = backend/tests
pythonpath = .
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    asyncio: coroutine test executed by pytest-asyncio.
filterwarnings =
    default
