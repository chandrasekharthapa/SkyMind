# SkyMind Domestic Route Catalog & Collector Configuration

collector:
  batch_size: 8
  max_workers: 4
  retry_attempts: 3
  retry_backoff_seconds: 30
  departure_buckets:
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 14
    - 21
    - 30
    - 45
    - 60
    - 75
    - 90

routes:
  # Primary Trunk Corridors (High Volume)
  - origin: DEL
    destination: BOM
    enabled: true
    priority: 100
  - origin: BOM
    destination: DEL
    enabled: true
    priority: 100

  - origin: DEL
    destination: BLR
    enabled: true
    priority: 95
  - origin: BLR
    destination: DEL
    enabled: true
    priority: 95

  - origin: DEL
    destination: HYD
    enabled: true
    priority: 90
  - origin: HYD
    destination: DEL
    enabled: true
    priority: 90

  - origin: DEL
    destination: MAA
    enabled: true
    priority: 90
  - origin: MAA
    destination: DEL
    enabled: true
    priority: 90

  - origin: DEL
    destination: CCU
    enabled: true
    priority: 90
  - origin: CCU
    destination: DEL
    enabled: true
    priority: 90

  - origin: DEL
    destination: BBI
    enabled: true
    priority: 85
  - origin: BBI
    destination: DEL
    enabled: true
    priority: 85

  # BBI's other two corridors. These were only ever in `backend/bash.py`'s
  # hardcoded STRATEGIC_ROUTES, a second ingestion driver that has been removed;
  # the collector reads this file and nothing else, so a route absent here was
  # never collected on a schedule no matter what that script listed.
  - origin: BBI
    destination: BOM
    enabled: true
    priority: 80
  - origin: BOM
    destination: BBI
    enabled: true
    priority: 80

  - origin: BBI
    destination: BLR
    enabled: true
    priority: 80
  - origin: BLR
    destination: BBI
    enabled: true
    priority: 80

  - origin: BOM
    destination: BLR
    enabled: true
    priority: 95
  - origin: BLR
    destination: BOM
    enabled: true
    priority: 95

  - origin: BOM
    destination: HYD
    enabled: true
    priority: 90
  - origin: HYD
    destination: BOM
    enabled: true
    priority: 90

  - origin: BOM
    destination: MAA
    enabled: true
    priority: 90
  - origin: MAA
    destination: BOM
    enabled: true
    priority: 90

  - origin: BOM
    destination: CCU
    enabled: true
    priority: 85
  - origin: CCU
    destination: BOM
    enabled: true
    priority: 85

  - origin: BLR
    destination: HYD
    enabled: true
    priority: 85
  - origin: HYD
    destination: BLR
    enabled: true
    priority: 85

  - origin: BLR
    destination: MAA
    enabled: true
    priority: 85
  - origin: MAA
    destination: BLR
    enabled: true
    priority: 85

  - origin: BLR
    destination: CCU
    enabled: true
    priority: 80
  - origin: CCU
    destination: BLR
    enabled: true
    priority: 80

  # Secondary Trunk Routes
  - origin: DEL
    destination: AMD
    enabled: true
    priority: 80
  - origin: AMD
    destination: DEL
    enabled: true
    priority: 80

  - origin: DEL
    destination: GOI
    enabled: true
    priority: 85
  - origin: GOI
    destination: DEL
    enabled: true
    priority: 85

  - origin: DEL
