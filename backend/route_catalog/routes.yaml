  # International — recorded, deliberately not collected.
  #
  # These four also came from `backend/bash.py`'s STRATEGIC_ROUTES. They stay
  # `enabled: false` because the only provider wired to the collector is the
  # Google Flights scraper reached over MCP (`backend/services/flight_data_service.py`
  # → `mcp_client.py` → `india-flight-mcp`), and the repository has no evidence it
  # returns results for an international pair —
  # `routes_from` would happily hand them to the collector, which would then log
  # a zero-match warning for each of 13 departure buckets every day and store
  # nothing. That is indistinguishable in the corpus from a route with no fares,
  # so it is left switched off rather than made to look collected. Turn these on
  # once a run against DEL-DXB is shown to persist rows.
  - origin: DEL
    destination: DXB
    enabled: false
    priority: 70
  - origin: DXB
    destination: DEL
    enabled: false
    priority: 70

  - origin: BOM
    destination: DXB
    enabled: false
    priority: 70
  - origin: DXB
    destination: BOM
    enabled: false
    priority: 70
