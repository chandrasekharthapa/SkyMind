name: SkyMind Daily Pipeline

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # A stalled step used to run to GitHub's 6-hour job ceiling, so the job is
    # bounded. 25 minutes was below what the pipeline needs, though: the catalogue is
    # ~55 routes x 13 departure buckets = ~715 scrapes, each a fresh Chromium, while
    # the collector's own budget (SCHEDULER_MAX_RUN_MINUTES) defaulted to 240. Every
    # run since the bound was added was killed mid-ingestion — no summary, no alert
    # check, no retrain, and no exit status anyone could act on.
    #
    # The ingestion budget is now set below (45 min) and this ceiling sits above it:
    #   setup, cold Chromium download           ~8 min
    #   ingestion budget                        45 min
    #   overshoot: the budget is checked between searches, and one search against
    #   a failing provider can take ~15 min (3 outer x 3 inner retries at 90 s)
    #   alerts + retrain + model upload         remainder
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache the npm registry downloads for the MCP server, keyed on its lockfile.
          cache: 'npm'
          cache-dependency-path: backend/india-flight-mcp/package-lock.json

      # `npm install` pulls puppeteer@^21, whose postinstall downloads a ~170 MB
      # Chromium into ~/.cache/puppeteer. Cache it so only the first run (or a
      # dependency change) pays for the download.
      #
      # Restore and save are separate steps on purpose. The combined `actions/cache`
      # saves in its post-job hook, which GitHub skips when the job is cancelled —
      # and every run was being cancelled at the job timeout, so the cache was never
      # written and every run paid the ~5-minute download again. Saving right after
      # the install makes the cache independent of how the rest of the job ends.
      - name: Restore Puppeteer browser
        id: puppeteer-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('backend/india-flight-mcp/package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install local MCP server dependencies
        # Fail fast if the Chromium download stalls, rather than hanging to the
        # job ceiling. A normal install (with the cache warm) is well under a minute.
        timeout-minutes: 10
        working-directory: backend/india-flight-mcp
        # `npm ci` is deterministic against the committed lockfile and faster than
        # `npm install`; it also fails cleanly if the lockfile drifts from package.json.
        run: npm ci

      - name: Save Puppeteer browser
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('backend/india-flight-mcp/package-lock.json') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Set env variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> $GITHUB_ENV
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> $GITHUB_ENV
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> $GITHUB_ENV
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> $GITHUB_ENV

      - name: Run pipeline
        env:
          # The repository root, not `.../backend`. With `backend` on the path,
          # `import services.x` and `import backend.services.x` both resolve to
          # the same file as two distinct module objects, each with its own
          # database singleton, cached predictor and circuit-breaker state.
          PYTHONPATH: ${{ github.workspace }}
          # The collector's wall-clock budget. Unset, it is 240 minutes — written for
          # the in-process scheduler on Render, and far past this job's ceiling. When
          # the budget runs out the collector stops cleanly, logs how many searches it
          # skipped, and the run goes on to alerts and retraining. Routes are collected
          # in priority order with all departure buckets per route, so a partial run
          # yields complete booking curves for the top routes, the same ones each day.
          SCHEDULER_MAX_RUN_MINUTES: '45'
        run: python backend/run_pipeline.py
